name: Release builds

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 1.1.0"
        required: true
        type: string
      title:
        description: "GitHub Release title"
        required: true
        type: string
      body:
        description: "GitHub Release notes"
        required: false
        default: ""
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: 24.x
  PNPM_VERSION: 11.x

jobs:
  prepare:
    name: Validate release inputs
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
      build_number: ${{ steps.metadata.outputs.build_number }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Require main branch
        run: test "$GITHUB_REF_NAME" = "main"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Capture release metadata
        id: metadata
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          node scripts/set-release-version.mjs "$VERSION" "$BUILD_NUMBER" --check-only
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Capture source commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

  android-release:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Apply release version
        run: node scripts/set-release-version.mjs "${{ inputs.version }}" "${{ needs.prepare.outputs.build_number }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build release APK
        run: |
          chmod +x android/gradlew
          (cd android && ./gradlew --no-daemon --stacktrace assembleRelease)
          APK_PATH="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          cp "$APK_PATH" "$RUNNER_TEMP/Lily-release.apk"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lily-release-apk
          path: ${{ runner.temp }}/Lily-release.apk
          if-no-files-found: error

  ios-release:
    name: Build unsigned iOS Release IPA
    runs-on: macos-latest
    needs: prepare
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Apply release version
        run: node scripts/set-release-version.mjs "${{ inputs.version }}" "${{ needs.prepare.outputs.build_number }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate iOS project
        run: pnpm exec expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios

      - name: Build unsigned iOS Release app
        env:
          DERIVED_DATA: ${{ runner.temp }}/lily-release-derived-data
        run: |
          IOS_WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$IOS_WORKSPACE"
          IOS_SCHEME="$(basename "$IOS_WORKSPACE" .xcworkspace)"

          xcodebuild \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

          APP_PATH="$(find "$DERIVED_DATA/Build/Products" -maxdepth 2 -type d -path '*-iphoneos/*.app' -print -quit)"
          test -n "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/release-ipa/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/release-ipa/Payload/$(basename "$APP_PATH")"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/release-ipa/Payload" "$RUNNER_TEMP/Lily-release.ipa"

      - name: Upload release IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: lily-release-ipa
          path: ${{ runner.temp }}/Lily-release.ipa
          if-no-files-found: error

  publish:
    name: Commit version and create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - android-release
      - ios-release
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Verify main did not change during the build
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
        run: test "$(git rev-parse HEAD)" = "$BASE_SHA"

      - name: Download release APK
        uses: actions/download-artifact@v5
        with:
          name: lily-release-apk
          path: release-files

      - name: Download release IPA
        uses: actions/download-artifact@v5
        with:
          name: lily-release-ipa
          path: release-files

      - name: Commit version and tag release
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: |
          TAG="v${VERSION}"
          if git show-ref --tags --verify --quiet "refs/tags/$TAG"; then
            echo "Tag $TAG already exists. Choose a new version." >&2
            exit 1
          fi

          node scripts/set-release-version.mjs "$VERSION" "$BUILD_NUMBER"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json app.json altsource.json
          git commit -m "chore: release $TAG [skip build]"
          git push origin HEAD:main
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TITLE: ${{ inputs.title }}
          RELEASE_BODY: ${{ inputs.body }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --verify-tag \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_BODY" \
            release-files/Lily-release.apk \
            release-files/Lily-release.ipa
